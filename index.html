<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抢宝箱大战 / Treasure Rush</title>
    <link rel="icon" href="./favicon.png" type="image/png">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    
    <div id="fever-overlay"></div>
    <div id="fever-banner">狂热时刻！</div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-box">
            <div>豆子: <span id="hud-gold" style="color:#FFD700;">0</span></div>
            <div style="font-size: 0.9rem; color: #CCC;">排名: <span id="hud-rank">1</span></div>
        </div>
        <div class="hud-box" id="hud-time">3:00</div>
        <div class="hud-box" id="hud-leaderboard">
            <!-- Leaderboard items injected here -->
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="hidden">
        <div class="control-area" style="top: 50%; right: 20px; left: auto; transform: translateY(-50%);">
            <button id="btn-toggle-mode" class="btn" style="padding: 5px 15px; font-size: 0.9rem;">操作: 摇杆</button>
        </div>
        <div id="joystick-area" class="control-area">
            <div id="joystick-knob"></div>
        </div>
        <div id="skills-area" class="control-area">
            <div class="skill-btn" id="btn-dash">
                冲刺
                <div class="cooldown-overlay hidden" id="cd-dash"></div>
            </div>
            <div class="skill-btn" id="btn-bomb">
                炸弹
                <div class="cooldown-overlay hidden" id="cd-bomb"></div>
            </div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="panel">
        <h1>抢宝箱大战</h1>
        <p class="subtitle">抢走宝箱，跑回基地，赢取奖金！</p>
        
        <div id="wallet-display">我的金币: <span id="ui-wallet">1000</span></div>

        <div class="settings-group">
            <label>参赛人数 (你 + AI)</label>
            <div class="btn-group" id="player-count-group">
                <button class="btn" data-count="2">2</button>
                <button class="btn" data-count="3">3</button>
                <button class="btn" data-count="4">4</button>
                <button class="btn" data-count="5">5</button>
                <button class="btn active" data-count="6">6</button>
            </div>
        </div>

        <button class="btn btn-start" id="btn-start-game">开始游戏 (花费 100 金币)</button>
    </div>

    <!-- Game Over Panel -->
    <div id="game-over" class="panel hidden">
        <h1 id="game-over-title">游戏结束</h1>
        <div class="pool-info" id="game-over-pool"></div>
        <ul id="game-over-list">
            <!-- Final scores injected here -->
        </ul>
        <button class="btn btn-start" id="btn-restart">再来一局</button>
    </div>

</div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
