<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treasure Rush - 抢宝箱大战</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevent default touch actions like zooming */
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 800px;
            background-color: #8fce00;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI overlays */
        .panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000, 0px 4px 10px rgba(0,0,0,0.5);
            color: #FFD700;
        }

        p.subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #EEE;
        }

        .settings-group {
            margin-bottom: 20px;
            text-align: center;
        }

        .settings-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #FFF;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            font-size: 1.1rem;
            border: 2px solid #FFF;
            background: #444;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .btn:hover, .btn.active {
            background: #FFD700;
            color: #000;
            border-color: #FFD700;
            transform: scale(1.05);
        }

        .btn-start {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #FF4500;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.5);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 69, 0, 0.5); }
            to { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255, 69, 0, 0.8); }
        }

        #wallet-display {
            font-size: 1.5rem;
            color: #FFD700;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-align: center;
        }

        .pool-info {
            font-size: 1rem;
            color: #FFF;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* In-Game HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 50;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }

        #hud-time {
            font-size: 1.5rem;
            color: #FFF;
            text-align: center;
        }
        
        #hud-time.fever {
            color: #FF4500;
            animation: timeFever 0.5s infinite alternate;
        }

        @keyframes timeFever {
            from { transform: scale(1); text-shadow: 0 0 5px #FF4500; }
            to { transform: scale(1.1); text-shadow: 0 0 15px #FF4500; }
        }

        #hud-leaderboard {
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 150px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }

        .leaderboard-item.is-player {
            color: #FFD700;
            text-shadow: 0 0 5px rgba(255,215,0,0.5);
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            pointer-events: none;
            z-index: 60;
        }

        .control-area {
            position: absolute;
            bottom: 20px;
            pointer-events: auto;
        }

        #joystick-area {
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transform: translate(0px, 0px);
        }

        #skills-area {
            right: 20px;
            display: flex;
            gap: 15px;
        }

        .skill-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #FFF;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .skill-btn:active {
            transform: scale(0.95);
            background: rgba(50, 50, 50, 0.8);
        }

        .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            pointer-events: none;
        }

        /* Game Over Panel */
        #game-over-list {
            list-style: none;
            padding: 0;
            width: 300px;
            margin-bottom: 30px;
        }

        #game-over-list li {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 5px;
            padding: 10px 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
        }

        #game-over-list li.is-player {
            background: rgba(255, 215, 0, 0.3);
            border: 1px solid #FFD700;
        }

        /* Fever Time overlay */
        #fever-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 50px rgba(255, 69, 0, 0.0);
            pointer-events: none;
            z-index: 10;
            transition: box-shadow 0.5s;
        }

        #fever-overlay.active {
            box-shadow: inset 0 0 100px rgba(255, 69, 0, 0.6);
            animation: feverPulse 2s infinite alternate;
        }
        
        @keyframes feverPulse {
            from { box-shadow: inset 0 0 80px rgba(255, 69, 0, 0.4); }
            to { box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.7); }
        }

        /* Fever Banner */
        #fever-banner {
            position: absolute;
            top: 30%;
            width: 100%;
            text-align: center;
            font-size: 4rem;
            color: #FF4500;
            font-weight: bold;
            text-shadow: 0 0 20px #FFF, 0 0 40px #FFD700;
            pointer-events: none;
            z-index: 90;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #fever-banner.show {
            opacity: 1;
            transform: scale(1);
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    
    <div id="fever-overlay"></div>
    <div id="fever-banner">狂热时刻！</div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-box">
            <div>豆子: <span id="hud-gold" style="color:#FFD700;">0</span></div>
            <div style="font-size: 0.9rem; color: #CCC;">排名: <span id="hud-rank">1</span></div>
        </div>
        <div class="hud-box" id="hud-time">3:00</div>
        <div class="hud-box" id="hud-leaderboard">
            <!-- Leaderboard items injected here -->
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="hidden">
        <div id="joystick-area" class="control-area">
            <div id="joystick-knob"></div>
        </div>
        <div id="skills-area" class="control-area">
            <div class="skill-btn" id="btn-dash">
                冲刺
                <div class="cooldown-overlay hidden" id="cd-dash"></div>
            </div>
            <div class="skill-btn" id="btn-bomb">
                炸弹
                <div class="cooldown-overlay hidden" id="cd-bomb"></div>
            </div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="panel">
        <h1>抢宝箱大战</h1>
        <p class="subtitle">抢走宝箱，跑回基地，赢取奖金！</p>
        
        <div id="wallet-display">我的金币: <span id="ui-wallet">1000</span></div>

        <div class="settings-group">
            <label>参赛人数 (你 + AI)</label>
            <div class="btn-group" id="player-count-group">
                <button class="btn" data-count="2">2</button>
                <button class="btn" data-count="3">3</button>
                <button class="btn" data-count="4">4</button>
                <button class="btn" data-count="5">5</button>
                <button class="btn active" data-count="6">6</button>
            </div>
        </div>

        <div class="settings-group">
            <label>操作模式</label>
            <div class="btn-group" id="control-mode-group">
                <button class="btn active" data-mode="joystick">摇杆 / 键盘</button>
                <button class="btn" data-mode="tap">点击移动</button>
            </div>
        </div>

        <button class="btn btn-start" id="btn-start-game">开始游戏 (花费 100 金币)</button>
    </div>

    <!-- Game Over Panel -->
    <div id="game-over" class="panel hidden">
        <h1 id="game-over-title">游戏结束</h1>
        <div class="pool-info" id="game-over-pool"></div>
        <ul id="game-over-list">
            <!-- Final scores injected here -->
        </ul>
        <button class="btn btn-start" id="btn-restart">再来一局</button>
    </div>

</div>

<script>
/**
 * Treasure Rush - Main Game Script
 */

// --- Constants & Config ---
const GAME_WIDTH = 800;
const GAME_HEIGHT = 800;

const CONFIG = {
    playerSpeed: 170,
    aiSpeed: 145,
    carrySpeedMultiplier: 0.7,
    dashMultiplier: 2.5,
    dashDuration: 0.3,
    dashCooldown: 5,
    bombRadius: 95,
    bombKnockback: 180, // slightly higher for more chaos
    bombCooldown: 6,
    gameDuration: 180, // seconds
    maxChests: 8,
    maxPowerups: 5,
    baseChestValue: 100,
    feverTimeThreshold: 30, // last 30 seconds
    chestSpawnInterval: 3000 // ms
};

const CHEST_PROBS = [
    { mult: 1, prob: 0.30, color: '#CD7F32' }, // Bronze
    { mult: 2, prob: 0.25, color: '#C0C0C0' }, // Silver
    { mult: 3, prob: 0.18, color: '#FFD700' }, // Gold
    { mult: 5, prob: 0.12, color: '#00FFFF' }, // Cyan
    { mult: 10, prob: 0.08, color: '#FF00FF' }, // Magenta
    { mult: 20, prob: 0.05, color: '#FF4500' }, // Orange Red
    { mult: 50, prob: 0.02, color: '#FFFFFF' }  // White/Diamond
];

const POWERUP_TYPES = [
    { type: 'SPEED', color: '#00FF00', icon: '⚡' },
    { type: 'SHIELD', color: '#00BFFF', icon: '🛡️' },
    { type: 'FREEZE', color: '#87CEFA', icon: '❄️' }
];

const COLORS = ['#1E90FF', '#DC143C', '#9400D3', '#32CD32', '#FF8C00', '#FF1493'];
const NAMES = ['你', '机器人 Alpha', '机器人 Beta', '机器人 Gamma', '机器人 Delta', '机器人 Epsilon'];

// --- Game State ---
let playerWallet = 1000;
const ENTRY_FEE = 100;

let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
let totalPlayers = 6;
let controlMode = 'joystick'; // joystick, tap
let timeRemaining = CONFIG.gameDuration;
let isFeverTime = false;
let lastTime = 0;
let chestSpawnTimer = 0;

let actors = [];
let chests = [];
let powerups = [];
let particles = [];
let emotes = [];

// --- Input State ---
const keys = { w:false, a:false, s:false, d:false, ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false, ' ':false, Shift:false };
let joystickInput = { x: 0, y: 0 };
let tapTarget = null;
let skillTriggers = { dash: false, bomb: false };

// --- DOM Elements ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiMainMenu = document.getElementById('main-menu');
const uiGameOver = document.getElementById('game-over');
const uiHud = document.getElementById('hud');
const uiMobileControls = document.getElementById('mobile-controls');
const feverOverlay = document.getElementById('fever-overlay');
const feverBanner = document.getElementById('fever-banner');

// Scaling handling to make game fit screen
let scale = 1;
function resizeCanvas() {
    const container = document.getElementById('game-container');
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const ratio = GAME_WIDTH / GAME_HEIGHT;
    
    if (vw / vh > ratio) {
        // screen is wider
        scale = vh / GAME_HEIGHT;
    } else {
        // screen is taller
        scale = vw / GAME_WIDTH;
    }
    
    // The canvas logical size is always 960x540
    // We scale it using CSS Transform or just let the container max-width handle it.
    // For crispness, we keep resolution 960x540.
    // Wait, the CSS is width:100%, height:100%. So the canvas element is stretched.
    // Let's actually adjust CSS max-width/height to maintain aspect ratio.
    const realWidth = GAME_WIDTH * scale;
    const realHeight = GAME_HEIGHT * scale;
    container.style.width = `${realWidth}px`;
    container.style.height = `${realHeight}px`;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- Input Handling ---
window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.key) && gameState === 'PLAYING') {
        keys[e.key] = true;
        if (e.key === ' ' && controlMode === 'joystick') skillTriggers.bomb = true;
        if (e.key === 'Shift' && controlMode === 'joystick') skillTriggers.dash = true;
    }
});
window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
});

// Tap to Move handling
canvas.addEventListener('pointerdown', (e) => {
    if (gameState !== 'PLAYING') return;
    if (controlMode === 'tap') {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        tapTarget = {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }
});

canvas.addEventListener('pointermove', (e) => {
    if (gameState !== 'PLAYING') return;
    if (controlMode === 'tap' && e.buttons > 0) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        tapTarget = {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }
});

canvas.addEventListener('pointerup', () => {
    if (controlMode === 'tap') {
        // Optionally clear target, but usually keeping it until reached is better for 'tap to move'
    }
});

// Virtual Joystick & Buttons
const joystickArea = document.getElementById('joystick-area');
const joystickKnob = document.getElementById('joystick-knob');
let isDraggingJoystick = false;

function updateJoystick(e) {
    if (!isDraggingJoystick) return;
    const rect = joystickArea.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    let dx = clientX - centerX;
    let dy = clientY - centerY;
    let distance = Math.sqrt(dx*dx + dy*dy);
    let maxDist = rect.width / 2 - 25; // 25 is knob half width
    
    if (distance > maxDist) {
        dx = (dx / distance) * maxDist;
        dy = (dy / distance) * maxDist;
    }
    
    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    
    // Normalize input
    if (distance > 5) {
        joystickInput.x = dx / maxDist;
        joystickInput.y = dy / maxDist;
    } else {
        joystickInput.x = 0;
        joystickInput.y = 0;
    }
}

joystickArea.addEventListener('pointerdown', (e) => {
    isDraggingJoystick = true;
    updateJoystick(e);
});
window.addEventListener('pointermove', (e) => {
    if(isDraggingJoystick) updateJoystick(e);
});
window.addEventListener('pointerup', () => {
    isDraggingJoystick = false;
    joystickKnob.style.transform = `translate(0px, 0px)`;
    joystickInput = {x: 0, y: 0};
});

document.getElementById('btn-dash').addEventListener('pointerdown', () => { if(gameState==='PLAYING') skillTriggers.dash = true; });
document.getElementById('btn-bomb').addEventListener('pointerdown', () => { if(gameState==='PLAYING') skillTriggers.bomb = true; });

// --- Menu UI Logic ---
document.getElementById('player-count-group').addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON') {
        document.querySelectorAll('#player-count-group .btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        totalPlayers = parseInt(e.target.dataset.count);
    }
});

document.getElementById('control-mode-group').addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON') {
        document.querySelectorAll('#control-mode-group .btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        controlMode = e.target.dataset.mode;
    }
});

document.getElementById('btn-start-game').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', resetGameToMenu);

// --- Game Classes ---

class Actor {
    constructor(id, isPlayer, color, name) {
        this.id = id;
        this.isPlayer = isPlayer;
        this.color = color;
        this.name = name;
        this.radius = 20;
        
        // Base assignment based on total players, distributed in circle
        const angle = (Math.PI * 2 / totalPlayers) * id;
        const dist = 220; // Distance from center
        this.baseX = GAME_WIDTH / 2 + Math.cos(angle) * dist;
        this.baseY = GAME_HEIGHT / 2 + Math.sin(angle) * dist;
        this.x = this.baseX;
        this.y = this.baseY;
        
        this.vx = 0;
        this.vy = 0;
        this.beans = 0;
        this.carryingChest = null;
        this.rewardCoins = 0;
        
        // Status
        this.frozenTime = 0;
        this.shield = false;
        this.speedBuffTime = 0;
        
        // Skills
        this.dashTime = 0;
        this.dashCooldown = 0;
        this.bombCooldown = 0;

        // AI specific
        this.aiTarget = null;
        this.aiState = 'SEARCH'; // SEARCH, CHASE, RETURN
        this.aiThinkTimer = 0;
    }

    getSpeed() {
        let speed = this.isPlayer ? CONFIG.playerSpeed : CONFIG.aiSpeed;
        if (this.speedBuffTime > 0) speed *= 1.5;
        if (this.carryingChest) speed *= CONFIG.carrySpeedMultiplier;
        if (this.dashTime > 0) speed *= CONFIG.dashMultiplier;
        
        // Fever time bonus
        if (isFeverTime) speed *= 1.2;
        return speed;
    }

    update(dt) {
        // Cooldowns
        if (this.dashTime > 0) this.dashTime -= dt;
        if (this.dashCooldown > 0) this.dashCooldown -= dt;
        if (this.bombCooldown > 0) this.bombCooldown -= dt;
        if (this.speedBuffTime > 0) this.speedBuffTime -= dt;
        if (this.frozenTime > 0) {
            this.frozenTime -= dt;
            return; // Can't move while frozen
        }

        // Apply knockback physics if any
        if (Math.abs(this.vx) > 10 || Math.abs(this.vy) > 10) {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            // Friction
            this.vx *= 0.85;
            this.vy *= 0.85;
        } else {
            this.vx = 0;
            this.vy = 0;
            // Normal Movement
            if (this.isPlayer) {
                this.updatePlayerMovement(dt);
            } else {
                this.updateAIMovement(dt);
            }
        }

        // Boundaries
        this.x = Math.max(this.radius, Math.min(GAME_WIDTH - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(GAME_HEIGHT - this.radius, this.y));

        // Base collision (Deposit chest)
        const distToBase = Math.hypot(this.x - this.baseX, this.y - this.baseY);
        if (distToBase < 40 && this.carryingChest) {
            // Deposit chest!
            let reward = CONFIG.baseChestValue * this.carryingChest.multiplier;
            this.beans += reward;
            
            // Emoji reaction (Happy)
            spawnEmote(this.x, this.y - 40, '💰');
            if (this.carryingChest.multiplier >= 10) spawnEmote(this.x, this.y - 60, '😎');

            this.carryingChest = null;
        }

        // Pick up chests
        if (!this.carryingChest) {
            for (let i = 0; i < chests.length; i++) {
                let chest = chests[i];
                if (!chest.carriedBy) {
                    let dist = Math.hypot(this.x - chest.x, this.y - chest.y);
                    if (dist < this.radius + chest.radius) {
                        chest.carriedBy = this;
                        this.carryingChest = chest;
                        break;
                    }
                }
            }
        }

        // Pick up powerups
        for (let i = powerups.length - 1; i >= 0; i--) {
            let p = powerups[i];
            let dist = Math.hypot(this.x - p.x, this.y - p.y);
            if (dist < this.radius + p.radius) {
                // Apply powerup
                if (p.type === 'SPEED') this.speedBuffTime = 5;
                if (p.type === 'SHIELD') this.shield = true;
                if (p.type === 'FREEZE') {
                    // Freeze enemies in radius
                    actors.forEach(a => {
                        if (a !== this && Math.hypot(this.x - a.x, this.y - a.y) < 200) {
                            if (a.shield) {
                                a.shield = false;
                            } else {
                                a.frozenTime = 2;
                                spawnEmote(a.x, a.y - 30, '🥶');
                            }
                        }
                    });
                }
                powerups.splice(i, 1);
            }
        }
    }

    updatePlayerMovement(dt) {
        let moveX = 0;
        let moveY = 0;

        if (controlMode === 'joystick') {
            // Keyboard WASD
            if (keys.w || keys.ArrowUp) moveY -= 1;
            if (keys.s || keys.ArrowDown) moveY += 1;
            if (keys.a || keys.ArrowLeft) moveX -= 1;
            if (keys.d || keys.ArrowRight) moveX += 1;

            // Joystick override
            if (joystickInput.x !== 0 || joystickInput.y !== 0) {
                moveX = joystickInput.x;
                moveY = joystickInput.y;
            }
        } else if (controlMode === 'tap' && tapTarget) {
            let dx = tapTarget.x - this.x;
            let dy = tapTarget.y - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 5) {
                moveX = dx / dist;
                moveY = dy / dist;
            } else {
                tapTarget = null; // Reached target
            }
        }

        // Normalize if using keys to prevent diagonal speedup
        if (moveX !== 0 && moveY !== 0 && controlMode === 'joystick' && joystickInput.x === 0) {
            let dist = Math.hypot(moveX, moveY);
            moveX /= dist;
            moveY /= dist;
        }

        this.x += moveX * this.getSpeed() * dt;
        this.y += moveY * this.getSpeed() * dt;

        // Player Skills Trigger
        if (skillTriggers.dash && this.dashCooldown <= 0) {
            this.useDash();
            skillTriggers.dash = false;
        }
        if (skillTriggers.bomb && this.bombCooldown <= 0) {
            this.useBomb();
            skillTriggers.bomb = false;
        }
    }

    updateAIMovement(dt) {
        this.aiThinkTimer -= dt;
        if (this.aiThinkTimer <= 0) {
            this.aiThinkTimer = 0.5; // think every 0.5s
            this.determineAITarget();
        }

        if (this.aiTarget) {
            let dx = this.aiTarget.x - this.x;
            let dy = this.aiTarget.y - this.y;
            let dist = Math.hypot(dx, dy);
            
            if (dist > 5) {
                this.x += (dx / dist) * this.getSpeed() * dt;
                this.y += (dy / dist) * this.getSpeed() * dt;
            }

            // AI Skill usage
            if (this.bombCooldown <= 0) {
                // Check if enemies are nearby
                let enemiesNearby = actors.filter(a => a !== this && Math.hypot(a.x - this.x, a.y - this.y) < CONFIG.bombRadius - 10);
                if (enemiesNearby.length > 0) {
                    // More likely to bomb if someone has a high value chest
                    let shouldBomb = enemiesNearby.some(a => a.carryingChest && a.carryingChest.multiplier >= 3) || Math.random() < 0.3;
                    if (shouldBomb) {
                        this.useBomb();
                    }
                }
            }

            if (this.dashCooldown <= 0 && dist > 100) {
                // Dash if chasing high value or returning home
                if (this.aiState === 'RETURN' && this.carryingChest.multiplier >= 5) {
                    this.useDash();
                } else if (this.aiState === 'CHASE') {
                    this.useDash();
                } else if (Math.random() < 0.1) {
                    this.useDash();
                }
            }
        }
    }

    determineAITarget() {
        if (this.carryingChest) {
            this.aiState = 'RETURN';
            this.aiTarget = { x: this.baseX, y: this.baseY };
            return;
        }

        // Check if any enemy is carrying a high multiplier chest nearby
        let bestEnemy = null;
        let highestMult = 2; // only chase if mult > 2
        let closestDist = Infinity;

        actors.forEach(a => {
            if (a !== this && a.carryingChest) {
                let dist = Math.hypot(a.x - this.x, a.y - this.y);
                if (a.carryingChest.multiplier > highestMult && dist < 300) {
                    highestMult = a.carryingChest.multiplier;
                    bestEnemy = a;
                    closestDist = dist;
                }
            }
        });

        if (bestEnemy) {
            this.aiState = 'CHASE';
            this.aiTarget = { x: bestEnemy.x, y: bestEnemy.y };
            return;
        }

        // Find best chest
        let bestChest = null;
        let bestScore = -Infinity;
        chests.forEach(c => {
            if (!c.carriedBy) {
                let dist = Math.hypot(c.x - this.x, c.y - this.y);
                // Score based on multiplier and distance
                let score = (c.multiplier * 100) - dist;
                if (score > bestScore) {
                    bestScore = score;
                    bestChest = c;
                }
            }
        });

        if (bestChest) {
            this.aiState = 'SEARCH';
            this.aiTarget = { x: bestChest.x, y: bestChest.y };
            return;
        }

        // Find powerups
        let nearestPowerup = null;
        let pDist = Infinity;
        powerups.forEach(p => {
            let d = Math.hypot(p.x - this.x, p.y - this.y);
            if (d < pDist) {
                pDist = d;
                nearestPowerup = p;
            }
        });

        if (nearestPowerup && pDist < 200) {
            this.aiState = 'SEARCH';
            this.aiTarget = { x: nearestPowerup.x, y: nearestPowerup.y };
            return;
        }

        // Wander
        this.aiTarget = {
            x: Math.max(50, Math.min(GAME_WIDTH - 50, this.x + (Math.random() - 0.5) * 200)),
            y: Math.max(50, Math.min(GAME_HEIGHT - 50, this.y + (Math.random() - 0.5) * 200))
        };
    }

    useDash() {
        this.dashTime = CONFIG.dashDuration;
        let realCd = CONFIG.dashCooldown;
        if (isFeverTime) realCd /= 2;
        this.dashCooldown = realCd;
        
        // Spawn dash particles
        for(let i=0; i<5; i++){
            spawnParticle(this.x, this.y, this.color, 15);
        }
    }

    useBomb() {
        let realCd = CONFIG.bombCooldown;
        if (isFeverTime) realCd /= 2;
        this.bombCooldown = realCd;

        // Create shockwave effect
        particles.push({
            type: 'shockwave',
            x: this.x,
            y: this.y,
            radius: 10,
            maxRadius: CONFIG.bombRadius,
            alpha: 1
        });

        // Apply knockback
        actors.forEach(a => {
            if (a !== this) {
                let dx = a.x - this.x;
                let dy = a.y - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist < CONFIG.bombRadius) {
                    if (a.shield) {
                        a.shield = false; // block knockback
                        spawnParticle(a.x, a.y, '#00BFFF', 20); // Shield break effect
                        return;
                    }
                    
                    // Knockback logic
                    let force = (CONFIG.bombRadius - dist) / CONFIG.bombRadius;
                    a.vx = (dx / dist) * CONFIG.bombKnockback * force * 5;
                    a.vy = (dy / dist) * CONFIG.bombKnockback * force * 5;
                    
                    // Drop chest
                    if (a.carryingChest) {
                        let c = a.carryingChest;
                        c.carriedBy = null;
                        c.x = a.x + (Math.random() - 0.5) * 40;
                        c.y = a.y + (Math.random() - 0.5) * 40;
                        a.carryingChest = null;
                        
                        // Angry emote
                        spawnEmote(a.x, a.y - 30, '💢');
                    }
                }
            }
        });
    }

    draw(ctx) {
        // Base
        ctx.beginPath();
        ctx.arc(this.baseX, this.baseY, 40, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.2;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = this.color;
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        // Actor Body
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.frozenTime > 0 ? '#87CEFA' : this.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#FFF';
        ctx.stroke();

        // Direction indicator (eyes)
        ctx.fillStyle = '#FFF';
        let lookX = 0, lookY = 0;
        if (this.vx !== 0 || this.vy !== 0) {
            let dist = Math.hypot(this.vx, this.vy);
            lookX = this.vx / dist * 10;
            lookY = this.vy / dist * 10;
        } else if (this.aiTarget) {
            let dist = Math.hypot(this.aiTarget.x - this.x, this.aiTarget.y - this.y);
            if (dist > 0) {
                lookX = (this.aiTarget.x - this.x) / dist * 10;
                lookY = (this.aiTarget.y - this.y) / dist * 10;
            }
        }
        ctx.beginPath();
        ctx.arc(this.x + lookX - 5, this.y + lookY - 5, 4, 0, Math.PI*2);
        ctx.arc(this.x + lookX + 5, this.y + lookY - 5, 4, 0, Math.PI*2);
        ctx.fill();

        // Name
        ctx.fillStyle = '#FFF';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(this.name, this.x, this.y + this.radius + 15);

        // Effects
        if (this.shield) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 191, 255, 0.8)';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // Draw carrying chest
        if (this.carryingChest) {
            // Drawn slightly above the head
            ctx.save();
            ctx.translate(this.x, this.y - 30);
            drawChestShape(ctx, this.carryingChest, 0); // No breathing animation while carrying
            ctx.restore();
        }
    }
}

class Chest {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 15;
        this.carriedBy = null;
        
        // Randomize multiplier based on probability, buffed if Fever Time
        let r = Math.random();
        let cumulative = 0;
        let selectedProb = CHEST_PROBS[0];
        
        for (let prob of CHEST_PROBS) {
            cumulative += prob.prob;
            if (r <= cumulative) {
                selectedProb = prob;
                break;
            }
        }

        if (isFeverTime && selectedProb.mult < 5) {
            // Force at least 5x during fever time
            selectedProb = CHEST_PROBS.find(p => p.mult === 5) || CHEST_PROBS[3];
        }

        this.multiplier = selectedProb.mult;
        this.color = selectedProb.color;
        this.time = Math.random() * 100; // for breathing animation
    }

    draw(ctx) {
        if (this.carriedBy) return; // Drawn by actor

        this.time += 0.05;
        let scale = 1 + Math.sin(this.time) * 0.1; // Breathing

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(scale, scale);
        drawChestShape(ctx, this, this.time);
        ctx.restore();
    }
}

function drawChestShape(ctx, chest, time) {
    // Glow for high tier
    if (chest.multiplier >= 10) {
        ctx.shadowBlur = 15 + Math.sin(time*2)*5;
        ctx.shadowColor = chest.color;
    }

    // Box
    ctx.fillStyle = '#8B4513'; // Wood
    ctx.fillRect(-12, -10, 24, 20);
    
    // Borders
    ctx.strokeStyle = chest.color;
    ctx.lineWidth = 3;
    ctx.strokeRect(-12, -10, 24, 20);

    ctx.shadowBlur = 0; // reset

    // Text
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${chest.multiplier}x`, 0, 0);
}

class Powerup {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 12;
        let typeObj = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
        this.type = typeObj.type;
        this.color = typeObj.color;
        this.icon = typeObj.icon;
        this.time = Math.random() * 100;
    }

    draw(ctx) {
        this.time += 0.05;
        let yOffset = Math.sin(this.time) * 5;

        ctx.beginPath();
        ctx.arc(this.x, this.y + yOffset, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.6;
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#FFF';
        ctx.stroke();

        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.icon, this.x, this.y + yOffset + 1);
    }
}

function spawnParticle(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            type: 'spark',
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 100,
            vy: (Math.random() - 0.5) * 100,
            life: 1,
            color: color
        });
    }
}

function spawnEmote(x, y, text) {
    emotes.push({
        x: x,
        y: y,
        text: text,
        life: 1.5,
        vy: -20
    });
}

// --- Core Logic ---

function initGame() {
    actors = [];
    chests = [];
    powerups = [];
    particles = [];
    emotes = [];
    timeRemaining = CONFIG.gameDuration;
    isFeverTime = false;
    tapTarget = null;
    feverOverlay.classList.remove('active');
    feverBanner.classList.remove('show');

    // Create Player
    actors.push(new Actor(0, true, COLORS[0], NAMES[0]));

    // Create AIs
    for (let i = 1; i < totalPlayers; i++) {
        actors.push(new Actor(i, false, COLORS[i % COLORS.length], NAMES[i]));
    }

    // Initial Chests
    for (let i = 0; i < CONFIG.maxChests; i++) {
        spawnChest();
    }
    
    // Initial Powerup
    spawnPowerup();
}

function spawnChest() {
    // Avoid spawning directly on bases
    let x, y, valid;
    do {
        valid = true;
        x = 50 + Math.random() * (GAME_WIDTH - 100);
        y = 50 + Math.random() * (GAME_HEIGHT - 100);
        for(let a of actors) {
            if(Math.hypot(x - a.baseX, y - a.baseY) < 100) {
                valid = false;
                break;
            }
        }
    } while(!valid);

    chests.push(new Chest(x, y));
}

function spawnPowerup() {
    let x = 50 + Math.random() * (GAME_WIDTH - 100);
    let y = 50 + Math.random() * (GAME_HEIGHT - 100);
    powerups.push(new Powerup(x, y));
}

function startGame() {
    if (playerWallet < ENTRY_FEE) {
        alert("金币不足！(请刷新页面重置金币)");
        return;
    }
    playerWallet -= ENTRY_FEE;
    updateWalletUI();

    initGame();
    gameState = 'PLAYING';
    uiMainMenu.classList.add('hidden');
    uiGameOver.classList.add('hidden');
    uiHud.classList.remove('hidden');
    
    if (controlMode !== 'tap') {
        // If joy/keys, show mobile UI only if on mobile (rough check)
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            uiMobileControls.classList.remove('hidden');
            // Hide joystick area if tap mode was selected but we fallback? 
            // Wait, logic says if NOT tap. So show full mobile controls.
        } else {
             // On desktop, we can hide joystick area but maybe show skill buttons or hide them.
             // Let's just hide mobile controls entirely on desktop for cleaner look, they use keys.
             // Actually, showing them doesn't hurt. We will show skills but hide joystick.
             uiMobileControls.classList.remove('hidden');
             joystickArea.style.display = 'none';
        }
    } else {
        // Tap mode: show skills, hide joystick
        uiMobileControls.classList.remove('hidden');
        joystickArea.style.display = 'none';
    }

    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function resetGameToMenu() {
    gameState = 'MENU';
    uiGameOver.classList.add('hidden');
    uiHud.classList.add('hidden');
    uiMobileControls.classList.add('hidden');
    uiMainMenu.classList.remove('hidden');
    
    // Reset mobile control layout fixes
    joystickArea.style.display = 'flex';
}

function gameOver() {
    gameState = 'GAMEOVER';
    uiHud.classList.add('hidden');
    uiMobileControls.classList.add('hidden');
    uiGameOver.classList.remove('hidden');
    
    // Sort and display leaderboard
    actors.sort((a, b) => b.beans - a.beans);
    
    let totalPool = totalPlayers * ENTRY_FEE;
    let platformFee = Math.floor(totalPool * 0.2);
    let rewardPool = totalPool - platformFee;
    let totalWeights = (totalPlayers * (totalPlayers - 1)) / 2;
    
    let distributed = 0;
    for (let i = 1; i < totalPlayers; i++) {
        let weight = totalPlayers - 1 - i;
        let reward = Math.floor(rewardPool * (weight / totalWeights));
        actors[i].rewardCoins = reward;
        distributed += reward;
    }
    actors[0].rewardCoins = rewardPool - distributed; // 1st place gets remainder

    document.getElementById('game-over-pool').innerHTML = `总奖池: <span style="color:#FFD700">${totalPool}</span> | 平台抽成(20%): <span style="color:#FF6347">${platformFee}</span> | 实际发放: <span style="color:#00FF00">${rewardPool}</span>`;

    const list = document.getElementById('game-over-list');
    list.innerHTML = '';
    
    actors.forEach((a, index) => {
        if (a.isPlayer) {
            playerWallet += a.rewardCoins;
            updateWalletUI();
        }

        let li = document.createElement('li');
        if (a.isPlayer) {
            li.className = 'is-player';
            document.getElementById('game-over-title').innerText = index === 0 ? '你赢了！' : `你获得了第 ${index+1} 名`;
        }
        
        let rewardText = a.rewardCoins > 0 ? `<span style="color:#00FF00;">+${a.rewardCoins} 金币</span>` : `<span style="color:#888;">无奖励</span>`;
        li.innerHTML = `<span>#${index+1} ${a.name}</span> <span style="color:#FFD700;">${a.beans} 豆</span> <span style="font-size:1rem;">${rewardText}</span>`;
        list.appendChild(li);
    });
}

function updateWalletUI() {
    let el = document.getElementById('ui-wallet');
    if(el) el.innerText = playerWallet;
}

// Call initially
window.onload = updateWalletUI;

function updateUI() {
    // Player specific UI
    const player = actors[0];
    
    // Time
    let mins = Math.floor(timeRemaining / 60);
    let secs = Math.floor(timeRemaining % 60);
    let timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
    const timeEl = document.getElementById('hud-time');
    timeEl.innerText = timeStr;
    
    if (isFeverTime) {
        timeEl.classList.add('fever');
    } else {
        timeEl.classList.remove('fever');
    }

    // Gold & Rank
    document.getElementById('hud-gold').innerText = player.beans;
    
    let sortedActors = [...actors].sort((a, b) => b.beans - a.beans);
    let playerRank = sortedActors.indexOf(player) + 1;
    document.getElementById('hud-rank').innerText = playerRank;

    // Leaderboard
    const lbEl = document.getElementById('hud-leaderboard');
    lbEl.innerHTML = '';
    for(let i=0; i<Math.min(3, sortedActors.length); i++) {
        let a = sortedActors[i];
        let div = document.createElement('div');
        div.className = `leaderboard-item ${a.isPlayer ? 'is-player' : ''}`;
        div.innerHTML = `<span>${i+1}. ${a.name}</span> <span>${a.beans}</span>`;
        lbEl.appendChild(div);
    }

    // Skills Cooldown UI
    if (player.dashCooldown > 0) {
        document.getElementById('cd-dash').classList.remove('hidden');
        document.getElementById('cd-dash').innerText = Math.ceil(player.dashCooldown);
    } else {
        document.getElementById('cd-dash').classList.add('hidden');
    }

    if (player.bombCooldown > 0) {
        document.getElementById('cd-bomb').classList.remove('hidden');
        document.getElementById('cd-bomb').innerText = Math.ceil(player.bombCooldown);
    } else {
        document.getElementById('cd-bomb').classList.add('hidden');
    }
}

function gameLoop(timestamp) {
    if (gameState !== 'PLAYING') return;

    let dt = (timestamp - lastTime) / 1000;
    // cap dt to prevent tunneling on lag
    if (dt > 0.1) dt = 0.1; 
    lastTime = timestamp;

    // Update time
    timeRemaining -= dt;
    if (timeRemaining <= 0) {
        timeRemaining = 0;
        gameOver();
        return;
    }

    // Check Fever Time
    if (timeRemaining <= CONFIG.feverTimeThreshold && !isFeverTime) {
        isFeverTime = true;
        feverOverlay.classList.add('active');
        feverBanner.classList.add('show');
        setTimeout(() => feverBanner.classList.remove('show'), 3000);
    }

    // Spawn Chests
    chestSpawnTimer += dt * 1000;
    if (chestSpawnTimer >= CONFIG.chestSpawnInterval) {
        chestSpawnTimer = 0;
        let uncarriedChests = chests.filter(c => !c.carriedBy).length;
        if (uncarriedChests < CONFIG.maxChests) {
            spawnChest();
        }
    }

    // Spawn Powerups
    if (Math.random() < 0.005 * dt * 60 && powerups.length < CONFIG.maxPowerups) {
        spawnPowerup();
    }

    // Update Entities
    actors.forEach(a => a.update(dt));

    // Resolve simple collisions between actors (push apart)
    for (let i = 0; i < actors.length; i++) {
        for (let j = i + 1; j < actors.length; j++) {
            let a1 = actors[i];
            let a2 = actors[j];
            let dx = a2.x - a1.x;
            let dy = a2.y - a1.y;
            let dist = Math.hypot(dx, dy);
            let minDist = a1.radius + a2.radius;
            
            if (dist < minDist && dist > 0) {
                let overlap = minDist - dist;
                let nx = dx / dist;
                let ny = dy / dist;
                
                // Push both apart
                a1.x -= nx * overlap * 0.5;
                a1.y -= ny * overlap * 0.5;
                a2.x += nx * overlap * 0.5;
                a2.y += ny * overlap * 0.5;
            }
        }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        if (p.type === 'shockwave') {
            p.radius += 300 * dt;
            p.alpha -= 2 * dt;
            if (p.alpha <= 0) particles.splice(i, 1);
        } else if (p.type === 'spark') {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // Update Emotes
    for (let i = emotes.length - 1; i >= 0; i--) {
        let e = emotes[i];
        e.y += e.vy * dt;
        e.life -= dt;
        if (e.life <= 0) emotes.splice(i, 1);
    }

    // Draw
    draw();

    // UI
    updateUI();

    requestAnimationFrame(gameLoop);
}

function draw() {
    // Clear
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    // Draw Map grid / pattern (simple styling)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.lineWidth = 1;
    for(let i=0; i<GAME_WIDTH; i+=60) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, GAME_HEIGHT); ctx.stroke();
    }
    for(let i=0; i<GAME_HEIGHT; i+=60) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(GAME_WIDTH, i); ctx.stroke();
    }

    // Draw tap target
    if (controlMode === 'tap' && tapTarget) {
        ctx.beginPath();
        ctx.arc(tapTarget.x, tapTarget.y, 10 + Math.sin(performance.now()/100)*5, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Draw Powerups
    powerups.forEach(p => p.draw(ctx));

    // Draw Chests (not carried)
    chests.forEach(c => c.draw(ctx));

    // Draw Actors
    // Sort actors by Y so lower ones draw on top (pseudo 3D)
    let sortedActorsForDraw = [...actors].sort((a,b) => a.y - b.y);
    sortedActorsForDraw.forEach(a => a.draw(ctx));

    // Draw Particles
    particles.forEach(p => {
        if (p.type === 'shockwave') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, p.alpha)})`;
            ctx.lineWidth = 5;
            ctx.stroke();
        } else if (p.type === 'spark') {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    });

    // Draw Emotes
    emotes.forEach(e => {
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.globalAlpha = Math.max(0, Math.min(1, e.life));
        
        // Emote bubble
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(e.x, e.y - 8, 16, 0, Math.PI*2);
        ctx.fill();
        
        // Emoji text
        ctx.fillText(e.text, e.x, e.y);
        ctx.globalAlpha = 1.0;
    });
}

</script>
</body>
</html>
